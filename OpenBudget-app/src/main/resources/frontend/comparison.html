<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ΥΠΕΝ - Σύγκριση Προϋπολογισμού</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1b5e20 0%, #0d4f1c 25%, #0a3d15 50%, #0d4f1c 75%, #1b5e20 100%);
            background-color: #0a3d15;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .ministry-header { text-align: center; margin: 30px 0 40px; width: 100%; }
        .ministry-header h1 {
            color: #e8f5e9;
            font-size: 38px;
            font-weight: 600;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.35);
            text-transform: uppercase;
        }
        .container { width: 100%; max-width: 900px; display: flex; justify-content: center; align-items: center; }
        .card {
            width: 100%;
            background: #ffffff;
            border-radius: 20px;
            padding: 48px 46px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.35);
            border: 3px solid #0d4f1c;
        }
        .section-title { text-align: center; font-size: 24px; font-weight: 700; color: #0d4f1c; margin-bottom: 16px; }
        .description { text-align: center; font-size: 16px; color: #2e7d32; margin-bottom: 24px; }
        .secondary-btn {
            display: inline-block;
            width: 100%;
            padding: 15px;
            background: #558b2f;
            color: #ffffff;
            text-align: center;
            text-decoration: none;
            font-size: 17px;
            font-weight: 600;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="ministry-header">
        <h1>ΥΠΟΥΡΓΕΙΟ ΠΕΡΙΒΑΛΛΟΝΤΟΣ ΚΑΙ ΕΝΕΡΓΕΙΑΣ</h1>
    </div>
    <div class="container">
        <div class="card">
            <!-- Content will be generated dynamically by Java -->
        </div>
    </div>
    <div class="container" style="margin-top: 30px;">
        <a class="secondary-btn" href="javascript:history.back()">Επιστροφή</a>
    </div>
</body>
</html>

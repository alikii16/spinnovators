<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ΥΠΕΝ - ESG Αξιολόγηση</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1b5e20 0%, #0d4f1c 25%, #0a3d15 50%, #0d4f1c 75%, #1b5e20 100%);
            background-color: #0a3d15;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .ministry-header { text-align: center; margin: 30px 0 40px; width: 100%; }
        .ministry-header h1 {
            color: #e8f5e9;
            font-size: 38px;
            font-weight: 600;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.35);
            text-transform: uppercase;
        }
        .container { width: 100%; max-width: 800px; display: flex; justify-content: center; align-items: center; }
        .card {
            width: 100%;
            background: #ffffff;
            border-radius: 20px;
            padding: 48px 46px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.35);
            border: 3px solid #0d4f1c;
        }
        .section-title { text-align: center; font-size: 24px; font-weight: 700; color: #0d4f1c; margin-bottom: 16px; }
        .description { text-align: center; font-size: 16px; color: #2e7d32; margin-bottom: 24px; }
        .esg-scores { display: flex; gap: 20px; margin-bottom: 32px; flex-wrap: wrap; justify-content: center; }
        .score-box {
            flex: 1;
            min-width: 180px;
            background: #e8f5e9;
            border: 2px solid #0d4f1c;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .score-box.difference { background: #fff3e0; border-color: #ff9800; }
        .score-label { font-size: 14px; color: #2e7d32; font-weight: 600; margin-bottom: 8px; }
        .score-value { font-size: 32px; font-weight: 700; color: #0d4f1c; margin-bottom: 4px; }
        .score-message { font-size: 12px; color: #1b5e20; font-weight: 600; margin-top: 8px; }
        .category-section { margin-top: 32px; padding-top: 24px; border-top: 2px solid #c8e6c9; }
        .category-title { font-size: 20px; font-weight: 700; color: #0d4f1c; margin-bottom: 20px; text-align: center; }
        .category-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            margin-bottom: 12px;
            background: #f9f9f9;
            border-radius: 8px;
            border: 1px solid #c8e6c9;
        }
        .category-label { font-weight: 600; color: #1b5e20; font-size: 15px; }
        .category-values { display: flex; gap: 12px; align-items: center; }
        .category-values span { font-size: 15px; color: #2e7d32; font-weight: 600; }
        .category-values .arrow { color: #81c784; }
        .category-values .diff { padding: 4px 8px; border-radius: 4px; font-weight: 700; }
        .category-values .diff.positive { background: #e8f5e9; color: #1b5e20; }
        .category-values .diff.negative { background: #ffebee; color: #c62828; }
        .category-values .diff.neutral { background: #f5f5f5; color: #616161; }
        .feedback-box {
            margin-top: 24px;
            padding: 16px 20px;
            background: #f1f8e9;
            border: 2px solid #0d4f1c;
            border-radius: 10px;
            text-align: center;
        }
        .feedback-box p { font-size: 16px; font-weight: 600; color: #1b5e20; margin: 0; }
        .secondary-btn {
            display: inline-block;
            width: 100%;
            padding: 15px;
            background: #558b2f;
            color: #ffffff;
            text-align: center;
            text-decoration: none;
            font-size: 17px;
            font-weight: 600;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="ministry-header">
        <h1>ΥΠΟΥΡΓΕΙΟ ΠΕΡΙΒΑΛΛΟΝΤΟΣ ΚΑΙ ΕΝΕΡΓΕΙΑΣ</h1>
    </div>
    <div class="container">
        <div class="card">
            <!-- Content will be generated dynamically by Java -->
        </div>
    </div>
    <div class="container" style="margin-top: 30px;">
        <a class="secondary-btn" href="/end-message">Επιστροφή</a>
    </div>
</body>
</html>

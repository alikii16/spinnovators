<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Αλλαγή Προϋπολογισμού</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: linear-gradient(135deg, #1b5e20 0%, #0d4f1c 25%, #0a3d15 50%, #0d4f1c 75%, #1b5e20 100%);
            background-color: #0a3d15;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 15% 40%, rgba(13, 79, 28, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 80% 70%, rgba(5, 26, 10, 0.25) 0%, transparent 55%);
            pointer-events: none;
            z-index: 0;
        }
        .ministry-header {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 40px;
            width: 100%;
            position: relative;
            z-index: 1;
        }
        .ministry-header h1 {
            color: #e8f5e9;
            font-size: 34px;
            font-weight: 600;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.35);
            text-transform: uppercase;
            line-height: 1.2;
        }
        .container {
            width: 100%;
            max-width: 640px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
        }
        .card {
            width: 100%;
            background: linear-gradient(135deg, #ffffff 0%, #f9f9f9 100%);
            border-radius: 20px;
            padding: 40px 36px;
            box-shadow:
                0 12px 48px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.9),
                0 0 0 2px rgba(13, 79, 28, 0.2);
            border: 3px solid #0d4f1c;
            text-align: center;
        }
        .section-title {
            font-size: 24px;
            font-weight: 700;
            color: #0d4f1c;
            margin-bottom: 16px;
        }
        .description {
            font-size: 16px;
            color: #2e7d32;
            margin-bottom: 18px;
        }
        .primary-btn, .secondary-btn {
            display: inline-block;
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #0d4f1c 0%, #1b5e20 100%);
            color: #ffffff;
            text-align: center;
            text-decoration: none;
            font-size: 17px;
            font-weight: 600;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(13, 79, 28, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 14px;
        }
        .primary-btn:hover, .secondary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(13, 79, 28, 0.45);
        }
        .secondary-btn {
            background: linear-gradient(135deg, #558b2f 0%, #33691e 100%);
            box-shadow: 0 6px 18px rgba(85, 139, 47, 0.4);
        }
    </style>
</head>
<body>
    <div class="ministry-header">
        <h1>ΥΠΟΥΡΓΕΙΟ ΠΕΡΙΒΑΛΛΟΝΤΟΣ ΚΑΙ ΕΝΕΡΓΕΙΑΣ</h1>
    </div>
    <div class="container">
        <div class="card">
            <h2 class="section-title">Αλλαγή Προϋπολογισμού</h2>
            <p class="description">Πατήστε συνέχεια για να ξεκινήσει η διαδικασία αλλαγής μέσω του backend.</p>
            <a class="primary-btn" href="/change-budget">Συνέχεια</a>
        </div>
    </div>
</body>
</html>

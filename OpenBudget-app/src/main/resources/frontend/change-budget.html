<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Αλλαγή Προϋπολογισμού</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #1b5e20 0%, #0d4f1c 25%, #0a3d15 50%, #0d4f1c 75%, #1b5e20 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .ministry-header {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 40px;
        }

        .ministry-header h1 {
            color: #e8f5e9;
            font-size: 36px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .container {
            width: 100%;
            max-width: 640px;
            display: flex;
            justify-content: center;
        }

        .card {
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.35);
            border: 3px solid #0d4f1c;
        }

        .section-title {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            color: #0d4f1c;
            margin-bottom: 30px;
        }

        .big-card {
            background: white;
            border-radius: 16px;
            padding: 28px;
            border: 2px solid #0d4f1c;
            box-shadow: 0 6px 16px rgba(0,0,0,0.10);
            margin-bottom: 28px;
            text-align: center;
        }

        .input-box {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1.5px solid #0d4f1c;
            font-size: 16px;
            margin-top: 12px;
        }

        .green-button, .red-button {
            padding: 10px 28px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            margin: 6px;
        }

        .green-button {
            background-color: #1b5e20;
            color: white;
        }

        .green-button:hover { background-color: #144d24; }

        .red-button {
            background-color: #b71c1c;
            color: white;
        }

        .red-button:hover { background-color: #9d1414; }

        .center {
            text-align: center;
        }

        .table-wrapper {
            margin-top: 26px;
            border: 2px solid #0d4f1c;
            border-radius: 10px;
            background: white;
        }

        .table-header {
            background: linear-gradient(135deg, #0d4f1c, #1b5e20);
            color: white;
            padding: 18px;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="ministry-header">
        <h1>ΥΠΟΥΡΓΕΙΟ ΠΕΡΙΒΑΛΛΟΝΤΟΣ ΚΑΙ ΕΝΕΡΓΕΙΑΣ</h1>
    </div>

    <div class="container">
        <div class="card">

            <h2 class="section-title">Αλλαγή Προϋπολογισμού</h2>

            <!-- ΕΡΩΤΗΣΗ 1 -->
            <div class="big-card">
                <h2>Θέλετε να κάνετε αλλαγές στον προϋπολογισμό;</h2>

                <form method="POST" action="/change-budget" class="center">
                    <button name="answer" value="YES" class="green-button">Ναι</button>
                    <button name="answer" value="NO" class="red-button">Όχι</button>
                </form>
            </div>

            {{secondQuestion}}

            {{budgetTable}}

            {{categoryMenu}}

        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenBudget – ΥΠΕΝ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #08130c, #0f2c1b 35%, #1d5c39 80%);
            font-family: "Segoe UI", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 60px 15px 80px;
            position: relative;
            color: #f5f8f4;
        }

        .background-text {
            color: rgba(213, 238, 219, 0.9);
            font-size: 36px;
            font-weight: 600;
            letter-spacing: 4px;
            opacity: 0.85;
            text-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            white-space: nowrap;
            text-align: center;
        }

        .section-container {
            width: 100%;
            max-width: 1040px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
            margin-top: 32px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
            padding: 38px 42px;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .card h2 {
            text-align: center;
            color: #0f3a24;
            margin-bottom: 22px;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .card p {
            text-align: center;
            font-size: 15px;
            color: #27412f;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #c9d7cf;
            border-radius: 10px;
            font-size: 15px;
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        .form-group input:focus {
            border-color: #1b5a3a;
            box-shadow: 0 0 0 3px rgba(27, 90, 58, 0.22);
            outline: none;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(120deg, #0f4c2c, #1b8a54);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 16px;
            letter-spacing: 0.5px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(15, 76, 44, 0.4);
        }

        .helper-text {
            text-align: center;
            font-size: 13px;
            color: #27412f;
            margin-top: 14px;
            letter-spacing: 0.3px;
        }

        .results-frame {
            width: 100%;
            min-height: 420px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-top: 18px;
            background-color: #fff;
        }
    </style>
</head>
<body>
    <div class="background-text">Υπουργείο Περιβάλλοντος και Ενέργειας</div>

    <div class="section-container" style="grid-template-columns: minmax(320px, 480px); justify-content:center;">
        <div class="card">
            <h2>Σύνδεση Χρήστη</h2>
            <p>Παρακαλώ εισάγετε τα στοιχεία εισόδου. Η επαλήθευση γίνεται από τον Java server.</p>
            <!--SERVER_MESSAGE-->
            <form method="post" action="http://localhost:8081/login">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required />
                </div>

                <button type="submit" class="submit-btn">Σύνδεση</button>
            </form>

            <p class="helper-text">
                Μετά από επιτυχή σύνδεση θα μεταφερθείτε αυτόματα στη φόρμα επιλογής έτους.
            </p>
        </div>
    </div>
</body>
</html>
